{% if page_obj.paginator.num_pages > 1 %}
<nav aria-label="Paginación">
  <ul class="pagination pagination-sm flex-wrap">
    {% if page_obj.has_previous %}
      <li class="page-item"><a class="page-link" href="{% querystring page=1 %}" hx-get="{% querystring page=1 %}" hx-target="#resultados" hx-push-url="true">« Primera</a></li>
      <li class="page-item"><a class="page-link" href="{% querystring page=page_obj.previous_page_number %}" hx-get="{% querystring page=page_obj.previous_page_number %}" hx-target="#resultados" hx-push-url="true">Anterior</a></li>
    {% endif %}
    <li class="page-item active" aria-current="page"><span class="page-link">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}
      <li class="page-item"><a class="page-link" href="{% querystring page=page_obj.next_page_number %}" hx-get="{% querystring page=page_obj.next_page_number %}" hx-target="#resultados" hx-push-url="true">Siguiente</a></li>
      <li class="page-item"><a class="page-link" href="{% querystring page=page_obj.paginator.num_pages %}" hx-get="{% querystring page=page_obj.paginator.num_pages %}" hx-target="#resultados" hx-push-url="true">Última »</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
